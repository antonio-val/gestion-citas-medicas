services:
  db:
    container_name: gestion-citas-medicas
    image: postgres:latest
    environment:
      POSTGRES_USER: newuser
      POSTGRES_PASSWORD: newpass
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge
volumes:
  db: